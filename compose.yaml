services:
  runwake:
    build:
      context: .
      target: runwake
      args:
        VERSION: ${RUNWAKE_VERSION:-0.1.0}
    image: runwake:${RUNWAKE_VERSION:-0.1.0}
    user: "0"
    ports:
      - "${RUNWAKE_PORT:-8080}:8080"
    environment:
      RUNWAKE_AUTH_TOKEN: ${RUNWAKE_AUTH_TOKEN:-}
      RUNWAKE_SECRET_KEY: ${RUNWAKE_SECRET_KEY:-}
      RUNWAKE_LOG_LEVEL: ${RUNWAKE_LOG_LEVEL:-info}
      RUNWAKE_ENABLE_INVESTIGATIONS: ${RUNWAKE_ENABLE_INVESTIGATIONS:-false}
    volumes:
      - runwake-data:/data
      - ${RUNWAKE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  runwake-data:
