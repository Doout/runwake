name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Static checks and tests
        run: make check

      - name: Vulnerability scan
        run: make vuln

      - name: Race detector
        run: make race

      - name: Startup smoke test
        run: make smoke

      - name: Validate scripts and Compose
        run: |
          sh -n scripts/*.sh
          shellcheck scripts/*.sh
          docker compose config --quiet
