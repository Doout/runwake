name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_line: ${{ steps.version.outputs.release_line }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-${REF_NAME#v}}"
          printf '%s\n' "$version" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "release version must use semantic version form, for example 1.2.3" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_line=${version%.*}" >> "$GITHUB_OUTPUT"

  server:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build server archives
        run: make release VERSION=${{ needs.prepare.outputs.version }}

      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ needs.prepare.outputs.version }}
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache-dependency-path: desktop-wails/go.sum

      - name: Build macOS desktop application
        run: make desktop-build VERSION=${{ needs.prepare.outputs.version }}

      - name: Verify embedded version
        run: |
          desktop-wails/build/bin/Runwake.app/Contents/MacOS/Runwake version \
            | grep -Fx "${{ needs.prepare.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            desktop-wails/build/bin/Runwake.app/Contents/Info.plist \
            | grep -Fx "${{ needs.prepare.outputs.version }}"

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Apple signing certificate is not configured; producing an unsigned desktop artifact"
            exit 0
          fi
          certificate="$RUNNER_TEMP/runwake-signing.p12"
          keychain="$RUNNER_TEMP/runwake-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"

      - name: Sign and notarize macOS application
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign-macos.sh desktop-wails/build/bin/Runwake.app

      - name: Package desktop application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            desktop-wails/build/bin/Runwake.app \
            "Runwake-${{ needs.prepare.outputs.version }}-macOS.zip"
          shasum -a 256 "Runwake-${{ needs.prepare.outputs.version }}-macOS.zip" \
            > "Runwake-${{ needs.prepare.outputs.version }}-macOS.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ needs.prepare.outputs.version }}
          path: |
            Runwake-${{ needs.prepare.outputs.version }}-macOS.zip
            Runwake-${{ needs.prepare.outputs.version }}-macOS.zip.sha256
          if-no-files-found: error

  container:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.release_line }}
            type=raw,value=latest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [prepare, server, desktop, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download server artifacts
        uses: actions/download-artifact@v8
        with:
          name: server-${{ needs.prepare.outputs.version }}
          path: release

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-${{ needs.prepare.outputs.version }}
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Runwake $VERSION" --generate-notes
          fi
          find release -type f -print0 \
            | xargs -0 gh release upload "$tag" --clobber
