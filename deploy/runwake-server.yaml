apiVersion: v1
kind: Namespace
metadata:
  name: runwake-system
---
apiVersion: v1
kind: Secret
metadata:
  name: runwake-server
  namespace: runwake-system
type: Opaque
stringData:
  auth-token: replace-with-a-long-random-token
  secret-key: replace-with-base64-encoded-32-byte-key
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runwake-data
  namespace: runwake-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runwake
  namespace: runwake-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runwake
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runwake
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runwake
          image: registry.example.com/runwake:0.1.0
          args: ["serve", "--listen", "0.0.0.0:8080", "--data-dir", "/data"]
          env:
            - name: RUNWAKE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runwake-server
                  key: auth-token
            - name: RUNWAKE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: runwake-server
                  key: secret-key
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: runwake-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: runwake
  namespace: runwake-system
spec:
  selector:
    app.kubernetes.io/name: runwake
  ports:
    - name: http
      port: 8080
      targetPort: http
